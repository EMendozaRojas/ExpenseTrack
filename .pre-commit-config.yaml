repos:
  # Checks genéricos
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
        # Originales de diseño: se guardan a tamaño completo a propósito.
        exclude: ^Design System/
      - id: check-merge-conflict
      - id: detect-private-key

  # Backend: lint + formato (Python)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Hooks que necesitan las dependencias del proyecto (mypy) o Node (ESLint,
  # Prettier): se ejecutan dentro de los contenedores, porque en el host no hay
  # Node ni las librerías del backend. Requieren `docker compose up -d`.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend, en el contenedor)
        entry: docker compose exec -T backend mypy app
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: eslint
        name: eslint (frontend, en el contenedor)
        entry: docker compose exec -T frontend npm run lint
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
      - id: prettier
        name: prettier (frontend, en el contenedor)
        entry: docker compose exec -T frontend npm run format:check
        language: system
        files: ^frontend/.*\.(ts|tsx|css|json)$
        pass_filenames: false

  # Mensajes de commit: Conventional Commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
