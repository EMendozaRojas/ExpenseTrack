# Comprueba cada push y pull request: calidad, tipos, vulnerabilidades,
# tests (el backend migra una base vacía desde cero) y build.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expensetrack
          POSTGRES_PASSWORD: expensetrack
          POSTGRES_DB: expensetrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expensetrack -d expensetrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://expensetrack:expensetrack@localhost:5432/expensetrack
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      ATTACHMENTS_DIR: /tmp/expensetrack-attachments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Formato (ruff format)
        run: ruff format --check .
      - name: Tipos (mypy)
        run: mypy app
      - name: Vulnerabilidades (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Tests y cobertura (pytest)
        run: pytest --cov --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Formato (Prettier)
        run: npm run format:check
      - name: Tests y cobertura (Vitest)
        run: npm run test:coverage
      - name: Build (tsc + Vite)
        run: npm run build
